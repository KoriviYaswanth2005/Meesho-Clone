<!DOCTYPE html>
<html lang="en">
 <style>
        .carousel-container {
            width: 100%;
            border: 5px solid #ccc;
            overflow: hidden;
            position: relative;
        }
        .carousel-wrapper {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        .carousel-item {
            min-width: 200px;
            height: 100px;
            background-color: #f0f0f0;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            border-radius: 5px;
        }
 </style>
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Scrolling Carousel
  </title>
  <link href="css/premium.css" rel="stylesheet"/>
  <link href="css/v5-enhancements.css" rel="stylesheet">
   <link href="css/v6-enhancements.css" rel="stylesheet"/>
   <link href="css/motion-v8.css" rel="stylesheet"/>
   <link href="assets/branding/meesho-logo.png" rel="icon" type="image/png"/>
  </link>
 </head>
 <body>
  <div aria-hidden="true" class="site-loader" id="siteLoader">
   <div class="site-loader-inner">
    <img alt="Meesho logo" class="site-loader-logo" src="assets/branding/meesho-logo.png"/>
    <div class="site-loader-spinner">
    </div>
    <div class="site-loader-text">
     Loading your shopping experience&hellip;
    </div>
   </div>
  </div>
  <br/>
  <div class="carousel-container">
   <marquee behavior="scroll" direction="left">
    <div class="carousel-wrapper">
     <div class="carousel-item">
      Baata
     </div>
     <div class="carousel-item">
      Himalaya
     </div>
     <div class="carousel-item">
      Mama Earth
     </div>
     <div class="carousel-item">
      MI
     </div>
     <div class="carousel-item">
      Apple
     </div>
    </div>
   </marquee>
  </div>
  <script src="js/premium.js">
  </script>
  <script src="js/v5-enhancements.js">
  </script>
 </body>
</html>
